name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract project if ZIP exists
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Extracting $f..."
            unzip -o "$f" -d .
            break
          done
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            for d in */ ; do
              if [ -f "${d}settings.gradle.kts" ] || [ -f "${d}settings.gradle" ]; then
                echo "Moving files from $d to root..."
                mv "${d}"* . || true
                break
              fi
            done
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
